<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystigo — The City Is Your Playground</title>
  <meta name="description" content="Mystigo is a gamified urban exploration app. Walk the city, solve enigmas, discover hidden heritage, and compete on a global leaderboard." />
  <meta property="og:title" content="Mystigo — The City Is Your Playground" />
  <meta property="og:description" content="Walk to real-world points of interest, solve enigmas, and compete on a global leaderboard. Think escape room meets Pokémon GO." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mystigo.world" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:        #681417;
      --primary-dark:   #4a0d0f;
      --secondary:      #141768;
      --bg-warm:        #E9E6DF;
      --accent-green:   #1EDD88;
      --accent-yellow:  #FFC65A;
      --text-dark:      #2E2E2E;
      --text-mid:       #5a5a5a;
      --white:          #FFFFFF;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      background: var(--bg-warm);
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(20, 8, 10, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 1rem;
    }

    .nav-logo {
      font-family: 'MedievalSharp', serif;
      font-size: 1.5rem;
      color: var(--white);
      text-decoration: none;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .nav-logo span { color: var(--accent-yellow); }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--white); }

    .lang-switcher {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      flex-shrink: 0;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.55);
      border-radius: 5px;
      padding: 0.28rem 0.5rem;
      font-size: 0.68rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.15s;
    }

    .lang-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--white);
      border-color: rgba(255,255,255,0.4);
    }

    .lang-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 1.5rem 5rem;
      background:
        radial-gradient(ellipse at 25% 40%, rgba(104,20,23,0.9) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 60%, rgba(20,23,104,0.9) 0%, transparent 55%),
        #0e0a0b;
      position: relative;
      overflow: hidden;
    }

    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    .compass-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,198,90,0.15);
      animation: pulse-ring 6s ease-in-out infinite;
    }
    .compass-ring:nth-child(1) { width: 500px; height: 500px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 0s; }
    .compass-ring:nth-child(2) { width: 700px; height: 700px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 1.5s; }
    .compass-ring:nth-child(3) { width: 900px; height: 900px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 3s; }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 0.35; transform: translate(-50%, -50%) scale(1.03); }
    }

    .hero-content { position: relative; z-index: 1; max-width: 760px; }

    .hero-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-yellow);
      border: 1px solid rgba(255,198,90,0.4);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      margin-bottom: 1.8rem;
    }

    .hero-title {
      font-family: 'MedievalSharp', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }

    .hero-title .accent { color: var(--accent-yellow); }

    .hero-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      color: rgba(255,255,255,0.72);
      max-width: 540px;
      margin: 0 auto 2.8rem;
      line-height: 1.6;
    }

    .hero-store-icons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .store-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1.4rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: var(--white);
      text-decoration: none;
      font-size: 0.82rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .store-badge:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.3);
    }

    .store-badge svg { flex-shrink: 0; }

    .store-badge .badge-label { display: flex; flex-direction: column; line-height: 1.3; }
    .store-badge .badge-sub  { font-size: 0.68rem; opacity: 0.7; font-weight: 400; }
    .store-badge .badge-name { font-weight: 600; font-size: 0.9rem; }

    /* ── STRIP ── */
    .strip {
      background: var(--primary);
      padding: 1rem 2rem;
      text-align: center;
    }

    .strip-inner {
      display: flex;
      gap: 3rem;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }

    .strip-inner span { white-space: nowrap; }
    .strip-inner .dot { color: var(--accent-yellow); }

    /* ── SECTIONS ── */
    section { padding: 6rem 1.5rem; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-family: 'MedievalSharp', serif;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.15;
      color: var(--text-dark);
      margin-bottom: 1rem;
    }

    .section-title--light { color: var(--white); }

    .section-body {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--text-mid);
      line-height: 1.75;
      max-width: 520px;
    }

    .section-body--light { color: rgba(255,255,255,0.65); }

    .container { max-width: 1100px; margin: 0 auto; }

    /* ── FEATURES ── */
    #features { background: var(--bg-warm); }

    .features-header { text-align: center; margin-bottom: 4rem; }
    .features-header .section-body { margin: 0 auto; }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .feature-card {
      background: var(--white);
      border-radius: 14px;
      padding: 2rem;
      border: 1px solid rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .feature-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(104,20,23,0.1);
    }

    .feature-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 1.2rem;
    }

    .icon-red    { background: rgba(104,20,23,0.1); }
    .icon-navy   { background: rgba(20,23,104,0.1); }
    .icon-green  { background: rgba(30,221,136,0.15); }
    .icon-yellow { background: rgba(255,198,90,0.2); }

    .feature-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: var(--text-dark);
    }

    .feature-card p {
      font-size: 0.88rem;
      color: var(--text-mid);
      line-height: 1.65;
    }

    /* ── HOW IT WORKS ── */
    #how-it-works {
      background:
        radial-gradient(ellipse at 80% 20%, rgba(104,20,23,0.7) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(20,23,104,0.7) 0%, transparent 50%),
        #0e0a0b;
    }

    .how-header { text-align: center; margin-bottom: 4rem; }
    .how-header .section-label { color: var(--accent-yellow); }

    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .step { display: flex; gap: 1.2rem; align-items: flex-start; }

    .step-num {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid rgba(255,198,90,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'MedievalSharp', serif;
      font-size: 1rem;
      color: var(--accent-yellow);
    }

    .step-body h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 0.4rem;
    }

    .step-body p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
    }

    /* ── ENIGMA TYPES ── */
    #enigmas { background: var(--bg-warm); }

    .enigmas-header { margin-bottom: 3rem; }

    .enigma-chips { display: flex; flex-wrap: wrap; gap: 0.75rem; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      background: var(--white);
      border: 1.5px solid rgba(0,0,0,0.08);
      color: var(--text-dark);
    }

    .chip-dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-red    { background: var(--primary); }
    .dot-navy   { background: var(--secondary); }
    .dot-green  { background: var(--accent-green); }
    .dot-yellow { background: var(--accent-yellow); }

    /* ── DISCOVERY ── */
    #discovery { background: var(--secondary); }

    .discovery-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    @media (max-width: 700px) { .discovery-inner { grid-template-columns: 1fr; } }

    .discovery-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .disc-map {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 45%, rgba(30,221,136,0.3), rgba(20,23,104,0.9) 70%);
      border: 2px solid rgba(30,221,136,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      position: relative;
    }

    .disc-pulse {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(30,221,136,0.4);
      animation: disc-pulse 3s ease-out infinite;
    }

    .disc-pulse:nth-child(1) { width: 260px; height: 260px; }
    .disc-pulse:nth-child(2) { width: 310px; height: 310px; animation-delay: 0.8s; }
    .disc-pulse:nth-child(3) { width: 360px; height: 360px; animation-delay: 1.6s; }

    @keyframes disc-pulse {
      0%   { opacity: 0.6; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    .discovery-section-label { color: var(--accent-green); }

    /* ── TIERS ── */
    #tiers { background: var(--bg-warm); }

    .tiers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    @media (max-width: 680px) { .tiers-grid { grid-template-columns: repeat(2, 1fr); } }

    .tier-card {
      background: var(--white);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .tier-card:hover { transform: translateY(-3px); }

    .tier-card.bronze   { border-color: #cd7f32; }
    .tier-card.silver   { border-color: #a8a9ad; }
    .tier-card.gold     { border-color: #d4af37; }
    .tier-card.platinum { border-color: #a0c4ff; }

    .tier-icon { font-size: 2.4rem; margin-bottom: 0.6rem; }

    .tier-card h3 {
      font-family: 'MedievalSharp', serif;
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
    }

    .tier-card.bronze   h3 { color: #cd7f32; }
    .tier-card.silver   h3 { color: #a8a9ad; }
    .tier-card.gold     h3 { color: #d4af37; }
    .tier-card.platinum h3 { color: #a0c4ff; }

    .tier-card p { font-size: 0.8rem; color: var(--text-mid); }

    /* ── LANGUAGES ── */
    #languages { background: var(--primary); text-align: center; }

    .lang-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 2.5rem;
    }

    .lang-item { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }

    .lang-flag { font-size: 2.5rem; line-height: 1; }

    .lang-name {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }

    /* ── DOWNLOAD CTA ── */
    #download {
      background:
        radial-gradient(ellipse at 30% 50%, rgba(104,20,23,0.85) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 50%, rgba(20,23,104,0.85) 0%, transparent 60%),
        #0e0a0b;
      text-align: center;
    }

    #download .section-label { color: var(--accent-yellow); }

    .download-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2.5rem;
    }

    /* ── FOOTER ── */
    footer {
      background: #0e0a0b;
      padding: 2.5rem 1.5rem;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .footer-logo {
      font-family: 'MedievalSharp', serif;
      font-size: 1.4rem;
      color: var(--white);
      margin-bottom: 1.2rem;
    }

    .footer-logo span { color: var(--accent-yellow); }

    .footer-links {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      list-style: none;
    }

    .footer-links a {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: rgba(255,255,255,0.8); }

    .footer-copy { font-size: 0.75rem; color: rgba(255,255,255,0.25); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      nav { padding: 0.85rem 1.2rem; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="/" class="nav-logo">Myst<span>i</span>go</a>
  <ul class="nav-links">
    <li><a href="#features"     data-i18n="nav.features"></a></li>
    <li><a href="#how-it-works" data-i18n="nav.how"></a></li>
    <li><a href="#download"     data-i18n="nav.download"></a></li>
    <li><a href="terms.html"    data-i18n="nav.terms"></a></li>
  </ul>
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn"        data-lang="fr">FR</button>
    <button class="lang-btn"        data-lang="pt">PT</button>
    <button class="lang-btn"        data-lang="zh">中</button>
  </div>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="compass-ring"></div>
  <div class="compass-ring"></div>
  <div class="compass-ring"></div>
  <div class="hero-content">
    <div class="hero-badge" data-i18n="hero.badge"></div>
    <h1 class="hero-title" data-i18n-html="hero.title"></h1>
    <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
    <div class="hero-store-icons">
      <a href="#download" class="store-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.18 23.5C2.84 23.31 2.5 22.96 2.5 22.38V1.62C2.5 1.04 2.84 0.69 3.18 0.5L14.29 11.94L3.18 23.5Z" fill="#EA4335"/>
          <path d="M18.37 15.8L14.29 11.94L18.37 8.08L21.5 9.9C22.38 10.42 22.38 11.46 21.5 11.98L18.37 15.8Z" fill="#FBBC04"/>
          <path d="M3.18 23.5L14.29 11.94L18.37 15.8L5.5 23.23C4.71 23.66 3.77 23.84 3.18 23.5Z" fill="#34A853"/>
          <path d="M3.18 0.5C3.77 0.16 4.71 0.34 5.5 0.77L18.37 8.08L14.29 11.94L3.18 0.5Z" fill="#4285F4"/>
        </svg>
        <div class="badge-label">
          <span class="badge-sub"  data-i18n="store.hero.play.sub"></span>
          <span class="badge-name">Google Play</span>
        </div>
      </a>
      <a href="#download" class="store-badge">
        <svg width="20" height="22" viewBox="0 0 814 1000" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105.4-57.4-155.9-127.3C34 353.5 6.4 262.7 6.4 175.7 6.4 79.8 43.8 37.6 98.5 37.6c49.7 0 82.1 33.4 139.7 33.4 55.8 0 92.7-33.4 143.8-33.4 52.3 0 90.7 32.9 131.3 91.9C537.3 164.5 578.7 194 620.1 194c49.7 0 87.1 30.6 91.8 34.3zm-37-235.3c-33.4 40.7-85 72.8-139.7 72.8-6.4 0-12.8-.6-19.2-1.3C566.3 108.9 610 60 644.8 26.2c-.6 38.2-28.8 79-45.4 79.4z"/>
        </svg>
        <div class="badge-label">
          <span class="badge-sub"  data-i18n="store.hero.apple.sub"></span>
          <span class="badge-name">App Store</span>
        </div>
      </a>
    </div>
  </div>
</section>

<!-- STRIP -->
<div class="strip">
  <div class="strip-inner">
    <span data-i18n="strip.1"></span>
    <span class="dot">·</span>
    <span data-i18n="strip.2"></span>
    <span class="dot">·</span>
    <span data-i18n="strip.3"></span>
    <span class="dot">·</span>
    <span data-i18n="strip.4"></span>
  </div>
</div>

<!-- FEATURES -->
<section id="features">
  <div class="container">
    <div class="features-header">
      <div class="section-label" data-i18n="features.label"></div>
      <h2 class="section-title" data-i18n="features.title"></h2>
      <p class="section-body" data-i18n="features.body"></p>
    </div>
    <div class="features-grid">
      <div class="feature-card">
        <div class="feature-icon icon-red">🗺️</div>
        <h3 data-i18n="f1.title"></h3>
        <p  data-i18n="f1.body"></p>
      </div>
      <div class="feature-card">
        <div class="feature-icon icon-navy">🔍</div>
        <h3 data-i18n="f2.title"></h3>
        <p  data-i18n="f2.body"></p>
      </div>
      <div class="feature-card">

const HTML_LANG = { en: 'en', fr: 'fr', pt: 'pt-BR', zh: 'zh-CN' };
const PAGE_TITLE = {
  en: 'Mystigo — The City Is Your Playground',
  fr: 'Mystigo — La Ville Est Votre Terrain de Jeu',
  pt: 'Mystigo — A Cidade É O Seu Playground',
  zh: 'Mystigo — 城市就是你的游乐场',
};

let currentLang = 'en';

function applyLang(code) {
  const t = T[code];
  if (!t) return;

  document.documentElement.lang = HTML_LANG[code] || code;
  document.title = PAGE_TITLE[code] || PAGE_TITLE.en;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });

  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const v = t[el.getAttribute('data-i18n-html')];
    if (v !== undefined) el.innerHTML = v;
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === code);
  });

  localStorage.setItem('mystigo-lang', code);
  currentLang = code;
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

(function init() {
  const saved    = localStorage.getItem('mystigo-lang');
  const browser  = (navigator.language || '').toLowerCase();
  let   detected = 'en';

  if (saved && T[saved]) {
    detected = saved;
  } else if (browser.startsWith('fr')) {
    detected = 'fr';
  } else if (browser.startsWith('pt')) {
    detected = 'pt';
  } else if (browser.startsWith('zh')) {
    detected = 'zh';
  }

  applyLang(detected);
})();
</script>
